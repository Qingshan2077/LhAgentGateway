server:
  port: 8885

spring:
  rabbitmq:
    host: localhost
    port: 5730
    username: guest
    password: guest
  application:
    name: lh-agent-gateway
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  cloud:
    gateway:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

logging:
  level:
    com.lh.gateway: DEBUG

# Resilience4j 熔断配置（降级调用路径的备选 Provider 保护）
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

llm:
  upstream:
    uri: ${LLM_UPSTREAM_URI:https://api.openai.com}
  adapter:
    # 供应商 base-url（熔断降级/健康检查路径用；压测验证备选切换时指向本地 Mock）
    openai:
      base-url: ${LLM_ADAPTER_OPENAI_BASE_URL:https://api.openai.com}
    deepseek:
      base-url: ${LLM_ADAPTER_DEEPSEEK_BASE_URL:https://api.deepseek.com}
    claude:
      base-url: ${LLM_ADAPTER_CLAUDE_BASE_URL:https://api.anthropic.com}
  rate-limit:
    # 全局层（保护网关整体与预算）
    global-capacity: 500
    global-rate: 100
    # AppKey 层（按调用方配额）
    app-key-capacity: 100
    app-key-rate: 20
    # Provider 层（按供应商保护，对应官方限流如 DeepSeek 50 QPS）
    provider-capacity: 200
    provider-rate: 50
  cache:
    # 缓存总开关：A/B 压测时用 --llm.cache.enabled=false 关闭缓存跑基线
    enabled: ${LLM_CACHE_ENABLED:true}
    ttl-seconds: 300
  router:
    # 默认路由策略：weighted | least-latency | consistent-hash（可用 X-Router-Strategy 头覆盖）
    strategy: weighted
  providers:
    # 多 Provider 配置（路由策略选择用）。带 X-Provider 头的请求固定走指定 Provider。
    # 压测时把 base-url 指向本地 Mock 即可验证三种路由策略。
    - name: openai
      base-url: ${LLM_PROVIDER_OPENAI_BASE_URL:${LLM_UPSTREAM_URI:https://api.openai.com}}
      weight: 3
    - name: deepseek
      base-url: ${LLM_PROVIDER_DEEPSEEK_BASE_URL:${LLM_ADAPTER_DEEPSEEK_BASE_URL:https://api.deepseek.com}}
      weight: 1
