server:
  port: 8885

spring:
  rabbitmq:
    host: localhost
    port: 5730
    username: guest
    password: guest
  application:
    name: lh-agent-gateway
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  cloud:
    gateway:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

logging:
  level:
    com.lh.gateway: DEBUG

llm:
  upstream:
    uri: ${LLM_UPSTREAM_URI:https://api.openai.com}
  rate-limit:
    # 全局层（保护网关整体与预算）
    global-capacity: 500
    global-rate: 100
    # AppKey 层（按调用方配额）
    app-key-capacity: 100
    app-key-rate: 20
    # Provider 层（按供应商保护，对应官方限流如 DeepSeek 50 QPS）
    provider-capacity: 200
    provider-rate: 50
  cache:
    # 缓存总开关：A/B 压测时用 --llm.cache.enabled=false 关闭缓存跑基线
    enabled: ${LLM_CACHE_ENABLED:true}
    ttl-seconds: 300
  rate-limit:
    # 三层令牌桶参数（全局 / AppKey / Provider），压测时用 --llm.rate-limit.global-rate=5000 放开
    global-capacity: 500
    global-rate: 100
    app-key-capacity: 100
    app-key-rate: 20
    provider-capacity: 200
    provider-rate: 50
