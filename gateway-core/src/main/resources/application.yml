server:
  port: 8885

spring:
  rabbitmq:
    host: localhost
    port: 5730
    username: guest
    password: guest
  application:
    name: lh-agent-gateway
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  cloud:
    gateway:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

logging:
  level:
    com.lh.gateway: DEBUG

llm:
  upstream:
    uri: ${LLM_UPSTREAM_URI:https://api.openai.com}
  cache:
    # 缓存总开关：A/B 压测时用 --llm.cache.enabled=false 关闭缓存跑基线
    enabled: ${LLM_CACHE_ENABLED:true}
    ttl-seconds: 300
