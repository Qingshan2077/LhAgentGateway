server:
  port: 8885

spring:
  rabbitmq:
    host: localhost
    port: 5730
    username: guest
    password: guest
  application:
    name: lh-agent-gateway
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  cloud:
    gateway:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

logging:
  level:
    com.lh.gateway: DEBUG
